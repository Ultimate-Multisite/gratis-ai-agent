<svg xmlns="http://www.w3.org/2000/svg" width="3.75in" height="2.25in" viewBox="0 0 1125 675" role="img" aria-labelledby="title desc">
  <style>@page { size: 3.75in 2.25in; margin: 0; }</style>
  <title id="title">SD AI Agent business card back</title>
  <desc id="desc">Business card promoting the free open source plugin, provider choice, and an early adopter AI usage offer.</desc>
  <rect width="1125" height="675" fill="#ffffff"/>
  <rect width="70" height="675" fill="#2271b1"/>

  <g transform="translate(100 74) scale(.46)">
