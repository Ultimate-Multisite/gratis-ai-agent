    <path fill="#ffffff" fill-opacity=".08" d="M282-5l13 39 39 13-39 13-13 39-13-39-39-13 39-13z"/>
    <text x="160" y="67" fill="#b5d9f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="1.5" text-anchor="middle">EARLY ADOPTERS</text>
