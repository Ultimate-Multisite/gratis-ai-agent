  <text x="154" y="472" fill="#1d2327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">Install it. Choose a model. Get to work.</text>
  <text x="100" y="580" fill="#135e96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800">SDAIAgent.com</text>

