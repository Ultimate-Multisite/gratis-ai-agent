name: Code Quality

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'TODO.md'
      - 'todo/**'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ESLint + Stylelint merged into a single job — saves a full pnpm install.
  lint:
    name: Lint (ESLint + Stylelint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint:js

      - name: Run Stylelint
        run: pnpm run lint:css

  # Build + bundle size merged — avoids a second install + build.
  build:
    name: Build & Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check for build artifacts
        run: |
          if [ ! -d "build" ] || [ -z "$(ls -A build/*.js 2>/dev/null)" ]; then
            echo "Build failed - no JS files in build directory"
            exit 1
          fi
          echo "Build successful - artifacts found:"
          ls -la build/

      - name: Check bundle size budgets
        run: pnpm run check:bundle
